[metadata]
name = reposync
version = 0.1.0
description = Atomic force mirroring of Git repositories across hosting platforms
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    PyYAML>=6.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    reposync = reposync.cli:main
